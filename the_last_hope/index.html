                g.drawImage(T[r.c] || T['#'], tx, 0, 1, 64, x, top, 2, h); const dk = Math.min(.94, r.t * L.fog + (r.side ? .12 : 0)); g.fillStyle = 'rgba(0,0,0,' + dk + ')'; g.fillRect(x, top, 2, h); zb[x] = zb[x + 1] = r.t
