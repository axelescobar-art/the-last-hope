<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #d8d8d8;
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden
        }

        #wrap {
            position: relative;
            width: min(100vw, 160vh);
            aspect-ratio: 8/5;
            font-size: clamp(11px, 1.9vw, 20px)
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
            cursor: crosshair
        }

        .ov {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5%;
            background: rgba(0, 0, 0, .9);
            line-height: 1.6;
            white-space: pre-line
        }

        .ov h1 {
            color: #f33;
            letter-spacing: 4px;
            margin: 0 0 .4em;
            text-shadow: 0 0 12px #a00
        }

        #hud {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, .7);
            border-top: 2px solid #0ff3;
            color: #0ff;
            padding: .3em 0
        }

        #msg {
            position: absolute;
            top: 3%;
            left: 0;
            right: 0;
            text-align: center;
            color: #ff6;
            text-shadow: 0 0 6px #000, 0 0 3px #000;
            display: none
        }

        #hint {
            position: absolute;
            bottom: 12%;
            left: 0;
            right: 0;
            text-align: center;
            color: #0f8;
            text-shadow: 0 0 4px #000
        }

        #dmg {
            position: absolute;
            inset: 0;
            background: radial-gradient(transparent 30%, #a00);
            opacity: 0;
            pointer-events: none
        }

        #dlg {
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: 12%;
            background: rgba(5, 10, 15, .93);
            border: 2px solid #0ff;
            padding: .8em 1em;
            display: none;
            line-height: 1.5
        }

        #dlg b {
            color: #f5a
        }

        button {
            font: inherit;
            background: #111;
            color: #0ff;
            border: 1px solid #0ff;
            padding: .3em 1.4em;
            margin: .5em .5em 0 0;
            cursor: pointer
        }

        button:hover {
            background: #0ff;
            color: #000
        }
    </style>
</head>
